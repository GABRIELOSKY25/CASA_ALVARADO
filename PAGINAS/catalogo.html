<!DOCTYPE html>
<html lang="en">
<head>
    <link rel = "stylesheet" href = "../CSS/index/main.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo</title>
</head>
<body>
    <div id="header"></div>
        <main>
        <section class="marcas">
        <div class="contenedor">
            <div class="carrusel-contenedor">
            <div class="carrusel-track" id="track">
                <div class="carrusel-item" data-nombre="Sensey Electronics">
                <img src="https://sensey.com.mx/images/SSy1.png" alt="Sensey">
                </div>
                <div class="carrusel-item" data-nombre="Shure">
                <img src="https://images.squarespace-cdn.com/content/v1/5ada405ff8370a9cc016afd7/1525291057145-SU4FODTVHMA8W1VN7G4E/logo_shure.png" alt="Shure">
                </div>
                <div class="carrusel-item" data-nombre="Alien Pro">
                <img src="https://cdn.cyberpuerta.mx/storage/brands/LogoAlienPro.png" alt="Alien Pro">
                </div>
                <div class="carrusel-item" data-nombre="Fender">
                <img src="https://audiomusic.mx/wp-content/uploads/2022/10/PhotoRoom-20221014_183321-574x96.png" alt="Fender">
                </div>
                <div class="carrusel-item" data-nombre="Yamaha">
                <img src="https://www.pngmart.com/files/23/Yamaha-Logo-PNG-HD.png" alt="Yamaha">
                </div>
                <div class="carrusel-item" data-nombre="Bose">
                <img src="https://1000logos.net/wp-content/uploads/2021/05/Bose-logo.png" alt="Bose">
                    </div>
            </div>
                <div class="controles-carrusel">
                <button class="btn-carrusel btn-prev" onclick="moverCarrusel(-1)" aria-label="Anterior">
                    &#10094; </button>
                <button class="btn-carrusel btn-next" onclick="moverCarrusel(1)" aria-label="Siguiente">
                    &#10095; </button>
            </div>
            </div>
        </section>
        <!-- FILTROS -->
        <section class="catalogo">

            <!-- FILTROS -->
            <aside class="filtros">

                <h2>Filtros</h2>

                <div class="grupo_filtro">

                    <h3>Marca</h3>

                    <label class="opcion_filtro">
                        <input type="checkbox">
                        Yamaha
                    </label>

                    <label class="opcion_filtro">
                        <input type="checkbox">
                        Fender
                    </label>

                    <label class="opcion_filtro">
                        <input type="checkbox">
                        Shure
                    </label>

                </div>

            </aside>

            <!-- PRODUCTOS -->
            <section class="tarjeta_productos">

                <div class="contenedor">

                    <div class="grid_productos">

                        <div class="targeta_producto">
                            <img src="https://images.unsplash.com/photo-1550985616-10810253b84d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80">
                            <h3>Guitarra Eléctrica Profesional</h3>
                            <div class="rating">⭐⭐⭐⭐⭐</div>
                            <a href="#" class="boton_producto">Ver más</a>
                        </div>

                        <div class="targeta_producto">
                            <img src="https://images.unsplash.com/photo-1519892300165-cb5542fb47c7?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80">
                            <h3>Batería Acústica Premium</h3>
                            <div class="rating">⭐⭐⭐⭐⭐</div>
                            <a href="#" class="boton_producto">Ver más</a>
                        </div>
                        <div class="targeta_producto">
                        <img src="https://images.unsplash.com/photo-1519892300165-cb5542fb47c7?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Batería Acústica">
                        <h3>Batería Acústica Premium</h3>
                        <div class="rating">⭐⭐⭐⭐⭐</div>
                        <a href="#" class="boton_producto">Ver más</a>
                    </div>
                    <div class="targeta_producto">
                        <img src="https://images.unsplash.com/photo-1598565117806-54d3a4f60c5b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Micrófono de Condensador">
                        <h3>Micrófono de Condensador</h3>
                        <div class="rating">⭐⭐⭐⭐</div>
                        <a href="#" class="boton_producto">Ver más</a>
                    </div>

                    </div>

                </div>

            </section>

        </section>
        </main>
    <div id="footer"></div>
    <script src="../JS/include.js"></script>
    <script src="../JS/app.js"></script>
    <script src="/JS/carusel.js"></script>
    <script src="/JS/fitrar.js"></script>
</body>
</html>
