<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Agregar Producto</title>
    <link rel="stylesheet" href="../CSS/index/main.css">
</head>
<body>

<section class="crud">

        <h1>Agregar Producto</h1>

        <form id="formAgregar">

            <input type="text" id="modelo" placeholder="Modelo" required>

            <input type="text" id="imagen" placeholder="URL Imagen" required>

            <textarea id="descripcion"
            placeholder="Descripción"></textarea>

            <select id="id_marca" required>
            <option value="">Seleccione una marca</option>
            </select>

            <select id="id_categoria" required>
            <option value="">Seleccione una categoria</option>
            </select>

            <select id="id_tipo" required>
            <option value="">Seleccione un tipo</option>
            </select>

            <select id="id_gamma" required>
            <option value="">Seleccione una gamma</option>
            </select>

            <select id="novedad">

                <option value="Si">Novedad</option>

                <option value="No">Normal</option>

            </select>

            <button type="submit">
                Agregar Producto
            </button>

        </form>

    </div>

</section>
<script src="../JS/add.js"></script>


</body>
</html>
