<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>

    <link rel="stylesheet" href="../CSS/index/main.css">
</head>
<body>

<section class="crud">

    <a href="admin.html" class="btn-volver">
    ← Volver al Panel
    </a>
    <div class="crud-contenedor">

        <h1>Editar Producto</h1>

        <input
        type="text"
        id="buscarModelo"
        placeholder="Modelo a buscar">

        <button onclick="buscarProducto()">
            Buscar Producto
        </button>

        <form id="formEditar">

            <input type="text" id="modelo">

            <input type="text" id="imagen">

            <textarea id="descripcion"></textarea>

            <select id="id_marca"></select>

<select id="id_categoria"></select>

<select id="id_tipo"></select>

<select id="id_gamma"></select>


            <select id="novedad">

                <option value="Si">Novedad</option>

                <option value="No">Normal</option>

            </select>

            <button type="submit">
                Actualizar Producto
            </button>

        </form>

    </div>

</section>

<script src="../JS/modificar.js"></script>

</body>
</html>
