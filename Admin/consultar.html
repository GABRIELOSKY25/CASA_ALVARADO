<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Consultar Productos | Casa Alvarado</title>
    <link rel="stylesheet" href="../CSS/index/main.css">
    <link rel="stylesheet" href="../CSS/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Prata&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header"></div>

    <section class="crud-section">
        <div class="contenedor">
            <div class="crud-card">
                <div class="crud-header">
                    <i class="fas fa-boxes"></i>
                    <h1>Lista de Productos</h1>
                    <p>Consulta todos los productos del catálogo</p>
                </div>

                <div class="crud-form">
                    <div class="filtros-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px;">
                        <div class="input-group">
                            <i class="fas fa-folder"></i>
                            <select id="filtroCategoria">
                                <option value="">Selecciona una categoría</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-trademark"></i>
                            <select id="filtroMarca" disabled>
                                <option value="">Primero selecciona una categoría</option>
                            </select>
                        </div>
                    </div>

                    <div class="tabla-container" style="overflow-x: auto; margin-bottom: 30px;">
                        <table class="crud-tabla" style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr>
                                    <th>Imagen</th>
                                    <th>Modelo</th>
                                    <th>Marca</th>
                                    <th>Tipo</th>
                                    <th>Gamma</th>
                                </tr>
                            </thead>
                            <tbody id="tablaProductos">
                                <tr>
                                    <td colspan="5" class="loading">Selecciona una categoría para ver productos</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="form-buttons" style="margin-top: 20px;">
                        <a href="/Admin/admin.html" class="btn-cancel">
                            <i class="fas fa-arrow-left"></i> Volver al Panel
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script src="../JS/include.js"></script>
    <script src="../JS/consultar.js"></script>
    <script src="../JS/app.js"></script>
</body>
</html>
