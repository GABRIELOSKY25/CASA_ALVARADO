<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>

    <link rel="stylesheet" href="../CSS/index/main.css">

    <style>

        .filtros{
            display:flex;
            gap:20px;
            margin-bottom:20px;
        }

        select{
            padding:10px;
            font-size:16px;
        }

        img{
            width:80px;
        }

    </style>

</head>

<body>

<section class="crud">

    <div class="crud-contenedor">

        <h1>Lista de Productos</h1>

        <div class="filtros">

            <select id="filtroCategoria">
                <option value="">Selecciona una categoría</option>
            </select>

            <select id="filtroMarca">
                <option value="">Todas las marcas</option>
            </select>

        </div>

        <table>

            <thead>

                <tr>
                    <th>Imagen</th>
                    <th>Modelo</th>
                    <th>Marca</th>
                    <th>Tipo</th>
                    <th>Gamma</th>
                </tr>

            </thead>

            <tbody id="tablaProductos">

            </tbody>

        </table>

    </div>

</section>

<script>

const API_BASE = 'http://localhost:8000';

let productosCache = [];

const tablaProductos =
    document.getElementById('tablaProductos');

const filtroCategoria =
    document.getElementById('filtroCategoria');

const filtroMarca =
    document.getElementById('filtroMarca');

// ==========================
// CARGAR PRODUCTOS
// ==========================
async function cargarProductos(){

    const res = await fetch(
        `${API_BASE}/productos/todos`
    );

    const productos = await res.json();

    productosCache = productos;

    // ORDENAR POR PRIORIDAD
    productosCache.sort((a,b)=>{
        return (a.prioridad_marca || 999)
            - (b.prioridad_marca || 999);
    });

    generarCategorias();
}

// ==========================
// GENERAR CATEGORÍAS
// ==========================
function generarCategorias(){

    const categorias = [
        ...new Set(
            productosCache.map(p => p.categoria)
        )
    ];

    categorias.forEach(categoria=>{

        filtroCategoria.innerHTML += `
            <option value="${categoria}">
                ${categoria}
            </option>
        `;
    });
}

// ==========================
// CUANDO CAMBIA CATEGORÍA
// ==========================
filtroCategoria.addEventListener('change', ()=>{

    const categoria =
        filtroCategoria.value;

    if(!categoria){

        tablaProductos.innerHTML = '';

        filtroMarca.innerHTML =
            '<option value="">Todas las marcas</option>';

        return;
    }

    const productosCategoria =
        productosCache.filter(
            p => p.categoria === categoria
        );

    generarMarcas(productosCategoria);

    renderizarProductos(productosCategoria);
});

// ==========================
// GENERAR MARCAS
// ==========================
function generarMarcas(productos){

    filtroMarca.innerHTML =
        '<option value="">Todas las marcas</option>';

    const marcas = [
        ...new Set(
            productos.map(p => p.marca)
        )
    ];

    marcas.forEach(marca=>{

        filtroMarca.innerHTML += `
            <option value="${marca}">
                ${marca}
            </option>
        `;
    });
}

// ==========================
// FILTRAR POR MARCA
// ==========================
filtroMarca.addEventListener('change', ()=>{

    const categoria =
        filtroCategoria.value;

    const marca =
        filtroMarca.value;

    let productos =
        productosCache.filter(
            p => p.categoria === categoria
        );

    if(marca){

        productos = productos.filter(
            p => p.marca === marca
        );
    }

    renderizarProductos(productos);
});

// ==========================
// RENDER
// ==========================
function renderizarProductos(productos){

    tablaProductos.innerHTML = '';

    productos.forEach(producto=>{

        tablaProductos.innerHTML += `

        <tr>

            <td>
                <img src="${producto.imagen}">
            </td>

            <td>${producto.modelo}</td>

            <td>${producto.marca}</td>

            <td>${producto.tipo}</td>

            <td>${producto.gamma}</td>

        </tr>
        `;
    });
}

cargarProductos();

</script>

</body>
</html>
