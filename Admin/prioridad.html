<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Prioridad Marcas | Casa Alvarado</title>
    <link rel="stylesheet" href="../CSS/index/main.css">
    <link rel="stylesheet" href="../CSS/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Prata&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header"></div>

    <section class="crud-section">
        <div class="contenedor">
            <div class="crud-card">
                <div class="crud-header">
                    <i class="fas fa-ranking-star"></i>
                    <h1>Prioridad de Marcas</h1>
                    <p>Configura el orden de visualización de las marcas</p>
                </div>

                <div class="crud-form">
                    <div class="prioridad-grid">
                        <div class="input-group">
                            <i class="fas fa-folder"></i>
                            <select id="categoria">
                                <option value="">Seleccione una categoría</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-trademark"></i>
                            <select id="marca" disabled>
                                <option value="">Primero seleccione una categoría</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-chart-line"></i>
                            <select id="prioridad">
                                <option value="1">⭐ Prioridad 1 (Más alta)</option>
                                <option value="2">⭐⭐ Prioridad 2 (Media)</option>
                                <option value="3">⭐⭐⭐ Prioridad 3 (Normal)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button id="btnGuardar" class="btn-submit" onclick="guardarPrioridad()">
                            <i class="fas fa-save"></i> Guardar Prioridad
                        </button>
                        <a href="/Admin/admin.html" class="btn-cancel">
                            <i class="fas fa-arrow-left"></i> Volver al Panel
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script src="../JS/include.js"></script>
    <script src="../JS/prioridad.js"></script>
    <script src="../JS/app.js"></script>
</body>
</html>
